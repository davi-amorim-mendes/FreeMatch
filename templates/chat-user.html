<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeMatch</title>
    <link rel="shortcut icon" href="/static/icons/logo-morango.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <section class="landing-page home-page">
        <div class="container">
            <header class="header-home">
                <button class="voltar-chat" onclick="voltar_chat()"><i class="bi bi-arrow-bar-left"></i></button>
                <div class="chat-user-header">
                    <div class="grid-chat-img-user">
                        <img class="grid-chat-img" id="grid-chat-img" src="" alt="" srcset="">
                    </div>
                    <div class="chat-desc">
                        <div class="grid-chat-desc">
                            <p class="principal chat-desc-nome" id="chat-desc-nome">Carregando...</p>
                            <p class="secundario chat-desc-mensagem">Online</p>
                        </div>
                    </div>
                </div>
            </header>
            <section class="conteudo">
                <div class="chat-user-container">
                    <div class="area-chat" id="area-chat">
                        
                    </div>
                    <form class="mensagem" id="form-mensagem">
                        <input class="mensagem-input" type="text" name="" id="mensagem-input">
                        <button class="mensagem-submit" type="submit"><i class="bi bi-send"></i></button>
                    </form>
                </div>
            </section>
            <div class="menu">
                <button class="menu-btn" id="menu-explorar" onclick="select('explorar')"><i class="bi bi-fire"></i></button>
                <button class="menu-btn" id="menu-matches" onclick="select('matches')"><i class="bi bi-heart"></i></button>
                <button class="menu-btn select" id="menu-chat" onclick="select('chat')"><i class="bi bi-chat"></i></button>
                <button class="menu-btn" id="menu-perfil" onclick="select('perfil')"><i class="bi bi-person"></i></button>
                <button class="menu-btn" onclick="select('sair')"><i class="bi bi-power"></i></button>
            </div>
        </div>
        <span class="apoie">
            <h1 class="apoie-h1">Apoie o FreeMatch!</h1>
            <img src="/static/pix/pix.png" class="apoie-pix">
        </span>
    </section>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
<script>
        // ==================== CONFIGURAÇÃO ====================
        const idConversa = {{ id_conversa }};
        let idUsuarioLogado = null;
        
        const areaChat = document.getElementById('area-chat');
        const formMensagem = document.getElementById('form-mensagem');
        const inputMensagem = document.getElementById('mensagem-input');

        // ==================== FUNÇÕES AUXILIARES ====================
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) {
                return parts.pop().split(';').shift();
            }
            return null;
        }

        async function carregarIdUsuario() {
            try {
                const response = await fetch("/get-id", {
                    method: "GET",
                    credentials: "include"
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                idUsuarioLogado = data.id_usuario;
                console.log("✅ Meu ID:", idUsuarioLogado);
                
            } catch (error) {
                console.error("❌ Erro ao buscar ID:", error);
            }
        }

        function verificarLogin(idRemetente) {
            return idRemetente === idUsuarioLogado;
        }

        function adicionarMensagem(idRemetente, texto, criadaEm) {
            const divMsg = document.createElement('div');
            
            const ehMinha = verificarLogin(idRemetente);
            divMsg.className = ehMinha ? 'msg right' : 'msg left';
            
            const horario = formatarHorario(criadaEm);
            
            divMsg.innerHTML = `
                ${texto}
                <span class="msg-time">${horario}</span>
            `;
            
            areaChat.appendChild(divMsg);
        }

        function formatarHorario(dataHora) {
            if (!dataHora) return '';
            const data = new Date(dataHora);
            return data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function scrollParaBaixo() {
            areaChat.scrollTop = areaChat.scrollHeight;
        }

        function voltar_chat() {
            window.location.href = '/chat';
        }

        // ==================== SOCKET.IO ====================
        console.log('Inicializando Socket.IO...');
        
        const socket = io({
            auth: {
                token: getCookie("access_token_cookie")
            },
            transports: ['websocket']
        });

        socket.on('connect', async () => {
            console.log('✅ Conectado ao servidor');
            await carregarIdUsuario();
            socket.emit('entrar_conversa', { id_conversa: idConversa });
        });

        socket.on('disconnect', () => {
            console.log('⚠️ Desconectado do servidor');
        });

        socket.on('connect_error', (error) => {
            console.error('❌ Erro de conexão:', error);
        });

        socket.on('historico_mensagens', (data) => {
            console.log('📜 Histórico recebido:', data);
            areaChat.innerHTML = '';
            if (data.mensagens && data.mensagens.length > 0) {
                data.mensagens.forEach(msg => {
                    adicionarMensagem(msg.id_remetente, msg.texto, msg.criada_em);
                });
            }
            scrollParaBaixo();
        });

        socket.on('nova_mensagem', (data) => {
            console.log('💬 Nova mensagem:', data);
            adicionarMensagem(data.id_remetente, data.texto, data.criada_em);
            scrollParaBaixo();
        });

        // ==================== EVENTOS ====================
        formMensagem.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const texto = inputMensagem.value.trim();
            if (texto) {
                console.log('📤 Enviando mensagem:', texto);
                socket.emit('enviar_mensagem', {
                    id_conversa: idConversa,
                    texto: texto
                });
                inputMensagem.value = '';
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const chat_nome = document.querySelector("#chat-desc-nome");
            const chat_foto = document.querySelector("#grid-chat-img");

            chat_nome.textContent = sessionStorage.getItem("chat_nome");
            chat_foto.src = sessionStorage.getItem("chat_foto");
            scrollParaBaixo();
        });
    </script>
<script src="/static/js/menu.js"></script>
</html>
