<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeMatch</title>
    <link rel="shortcut icon" href="/static/icons/logo-morango.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <section class="landing-page home-page">
        <div class="container">
            <header class="header-home">
                <a href="/explorer">
                    <img src="/static/icons/logo.png" class="logo-home">
                </a>
                <span class="gratuito">
                    4 Conversas
                </span>
            </header>
            <section class="conteudo">
                <h1 class="desc-chat-h1"><span class="heart-ballon"><i class="bi bi-chat-heart"></i></span> Mensagens</h1>
                <div class="grid-chat">
                    <div class="grid-chat-bar">
                        <div class="grid-chat-img-div">
                            <img class="grid-chat-img" src="/static/img/lilis.jpg" alt="" srcset="">
                        </div>
                        <div class="chat-desc">
                            <div class="grid-chat-desc">
                                <p class="principal chat-desc-nome">Ana</p>
                                <p class="secundario chat-desc-mensagem">Oi! Tudo bem? 🥰</p>
                            </div>
                            <span class="chat-desc-nova"></span>
                        </div>
                    </div>
                    <div class="grid-chat-bar">
                        <div class="grid-chat-img-div">
                            <img class="grid-chat-img" src="/static/img/davi.jpg" alt="" srcset="">
                        </div>
                        <div class="chat-desc">
                            <div class="grid-chat-desc">
                                <p class="principal chat-desc-nome">Davi</p>
                                <p class="secundario chat-desc-mensagem">Estive pensando em você... 😏💦</p>
                            </div>
                            <span class="chat-desc-nova"></span>
                        </div>
                    </div>
                    <div class="grid-chat-bar">
                        <div class="grid-chat-img-div">
                            <img class="grid-chat-img" src="/static/img/indiana.avif" alt="" srcset="">
                        </div>
                        <div class="chat-desc">
                            <div class="grid-chat-desc">
                                <p class="principal chat-desc-nome">Clarisse</p>
                                <p class="secundario chat-desc-mensagem">Quando você vem pra Índia? 😳</p>
                            </div>
                            <span class="chat-desc-nova"></span>
                        </div>
                    </div>
                    <div class="grid-chat-bar">
                        <div class="grid-chat-img-div">
                            <img class="grid-chat-img" src="/static/img/broxa.jpg" alt="" srcset="">
                        </div>
                        <div class="chat-desc">
                            <div class="grid-chat-desc">
                                <p class="principal chat-desc-nome">Véio Broxa</p>
                                <p class="secundario chat-desc-mensagem">Já comprei o tadala 🔥🔥🔥</p>
                            </div>
                            <span class="chat-desc-nova"></span>
                        </div>
                    </div>
                </div>
            </section>
            <div class="menu">
                <button class="menu-btn" id="menu-explorar" onclick="select('explorar')"><i class="bi bi-fire"></i></button>
                <button class="menu-btn" id="menu-matches" onclick="select('matches')"><i class="bi bi-heart"></i></button>
                <button class="menu-btn select" id="menu-chat" onclick="select('chat')"><i class="bi bi-chat"></i></button>
                <button class="menu-btn" id="menu-perfil" onclick="select('perfil')"><i class="bi bi-person"></i></button>
                <button class="menu-btn" onclick="select('sair')"><i class="bi bi-power"></i></button>
            </div>
        </div>
        <span class="apoie">
            <h1 class="apoie-h1">Apoie o FreeMatch!</h1>
            <img src="/static/pix/pix.png" class="apoie-pix">
        </span>
    </section>
</body>
<script src="/static/js/menu.js"></script>
</html>
